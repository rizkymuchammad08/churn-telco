    [seed, data_source, data_source_allowed, paths, sample, schema, temporal, leakage, split, models, calibration, evaluation]
  assumptions:
    [currency, baseline_churn_rate, target_churn_rate, clv, cost_intervention, save_rate, save_rate_source, campaign_capacity, population_per_period]
public_api:
