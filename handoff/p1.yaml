  - pyproject.toml
  - constraints.txt
  - .gitignore
  - .env.example
  - README.md
  - params.yaml
  - assumptions.yaml
  - docs/adaptation_path_a.md
  - src/config.py
  - scripts/check_handoff.py
  - scripts/scan_placeholders.py
  - tests/test_assumptions_schema.py
  - data/raw/WA_Fn-UseC_-Telco-Customer-Churn.csv
